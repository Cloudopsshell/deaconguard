name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is a semantic version
        id: version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="$RUNNER_TEMP/release-notes.md"
          # A pre-release such as 0.2.0-rc.1 uses the notes for the version it previews.
          for wanted in "$version" "${version%%-*}"; do
            awk -v wanted="[$wanted]" 'index($0, "## ") == 1 { found = index($0, wanted) > 0; next } /^\[[^]]+\]: / { found = 0 } found' CHANGELOG.md > "$notes"
            [ -s "$notes" ] && break
          done
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $version; add one before tagging"
            exit 1
          fi
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            { printf '> Pre-release of %s for testing. Do not use in production.\n\n' "${version%%-*}"; cat "$notes"; } > "$notes.tmp" && mv "$notes.tmp" "$notes"
          fi
          cat "$notes"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The newest 1.26 patch release, so builds include Go security fixes;
          # go.mod only states the minimum version.
          go-version: "1.26.x"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Release binaries, DEB, and RPM packages
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A release and its candidate share a commit; without this GoReleaser
          # may pick the candidate's tag and upload to the wrong release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container tags and labels
        id: image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cloudopsshell/opsarmor
          # Pre-releases get only their exact tag; stable releases also move
          # the minor-version tag and latest.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build and publish multi-architecture container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Package Helm chart
        run: >-
          helm package charts/opsarmor
          --version "${GITHUB_REF_NAME#v}"
          --app-version "${GITHUB_REF_NAME#v}"
          --destination dist

      - name: Checksum Helm chart
        run: sha256sum dist/opsarmor-*.tgz > dist/opsarmor-chart-checksums.txt

      - name: Attach Helm chart to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/opsarmor-*.tgz dist/opsarmor-chart-checksums.txt --clobber