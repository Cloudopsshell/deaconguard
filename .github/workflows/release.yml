name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Release Linux binaries, DEB, and RPM packages
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container tags and labels
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cloudopsshell/opsarmor
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish multi-architecture container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: >-
          helm package charts/opsarmor
          --version "${GITHUB_REF_NAME#v}"
          --app-version "${GITHUB_REF_NAME#v}"
          --destination dist

      - name: Checksum Helm chart
        run: sha256sum dist/opsarmor-*.tgz > dist/opsarmor-chart-checksums.txt

      - name: Attach Helm chart to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/opsarmor-*.tgz dist/opsarmor-chart-checksums.txt --clobber