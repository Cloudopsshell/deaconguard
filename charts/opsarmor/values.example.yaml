image:
  repository: ghcr.io/cloudopsshell/opsarmor
  tag: "v0.1.0"

scan:
  schedule: "0 2 * * *"

hosts:
  - id: ubuntu-prod
    address: 192.0.2.20
    username: ubuntu
    port: 22
    keyFile: id_ed25519
  - id: debian-stage
    address: debian.example.internal
    username: scanner
    port: 22
    keyFile: id_ed25519

ssh:
  existingSecret: opsarmor-ssh-keys
  knownHosts: |
    192.0.2.20 ssh-ed25519 REPLACE_WITH_VERIFIED_BASE64_HOST_KEY
    debian.example.internal ssh-ed25519 REPLACE_WITH_VERIFIED_BASE64_HOST_KEY

persistence:
  enabled: true
  size: 5Gi