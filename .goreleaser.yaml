version: 2
project_name: deaconguard

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: deaconguard
    main: ./cmd/deaconguard
    binary: deaconguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X deaconguard/internal/buildinfo.Version={{ .Version }}
      - -X deaconguard/internal/buildinfo.Commit={{ .FullCommit }}
      - -X deaconguard/internal/buildinfo.Date={{ .Date }}

archives:
  - id: default
    ids:
      - deaconguard
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE

# The container image, for Docker, Compose and Kubernetes: the Linux builds
# on a minimal base image (Chainguard's static, with CA certificates and no
# shell), for amd64 and arm64. ko pushes it without a Docker daemon. It runs
# as a non-root user; the agent's DaemonSet runs it as root, which it needs
# to read the host. The release workflow logs in to GHCR first.
kos:
  - id: image
    build: deaconguard
    main: ./cmd/deaconguard
    repositories:
      - ghcr.io/cloudopsshell/deaconguard
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    bare: true
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    labels:
      org.opencontainers.image.title: DeaconGuard
      org.opencontainers.image.description: Linux security scanner, server and agent
      org.opencontainers.image.source: https://github.com/Cloudopsshell/deaconguard
      org.opencontainers.image.url: https://deaconguard.io
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

# The image is signed keylessly too, by digest, like checksums.txt.
docker_signs:
  - id: image
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

# GoReleaser packages only the Linux builds as .deb and .rpm.
nfpms:
  - id: linux-packages
    package_name: deaconguard
    ids:
      - deaconguard
    vendor: CloudOpsShell
    homepage: https://github.com/Cloudopsshell/deaconguard
    maintainer: CloudOpsShell <opensource@cloudopsshell.com>
    description: >-
      Linux security scanner: package vulnerabilities from official
      distribution advisories, file integrity, malware indicators, security
      configuration, and ClamAV. One binary is the server, with an HTTPS
      dashboard, and the agent that enrolls with it using an enrollment token.
    license: MIT
    formats:
      - deb
      - rpm
    # The install script creates the deaconguard user with useradd.
    overrides:
      deb:
        dependencies:
          - passwd
      rpm:
        # A file, not shadow-utils: SUSE packages useradd as shadow.
        dependencies:
          - /usr/sbin/useradd
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/deaconguard/README.md
        type: doc
      - src: CHANGELOG.md
        dst: /usr/share/doc/deaconguard/CHANGELOG.md
        type: doc
      - src: LICENSE
        dst: /usr/share/doc/deaconguard/copyright
        type: doc
      - src: packaging/systemd/deaconguard-agent.service
        dst: /usr/lib/systemd/system/deaconguard-agent.service
        file_info:
          mode: 0644
      - src: packaging/systemd/deaconguard-server.service
        dst: /usr/lib/systemd/system/deaconguard-server.service
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
    deb:
      lintian_overrides:
        - statically-linked-binary
    rpm:
      summary: Linux security scanner with server and agent

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./packaging/install.sh

# One SBOM (SPDX JSON) for the release: Syft reads go.mod and
# web/package-lock.json, so it lists every Go module and npm package with
# versions and licenses. checksums.txt lists it, so the signature covers it too.
sboms:
  - id: source
    artifacts: any
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json"
    cmd: syft
    # GoReleaser runs this in dist/, so the repository root is "..".
    args:
      - "dir:.."
      - "--source-name={{ .ProjectName }}"
      - "--source-version={{ .Version }}"
      - "--exclude=./dist/**"
      - "--exclude=./web/node_modules/**"
      - "--output=spdx-json=$document"

# checksums.txt lists every release file, so signing it covers them all. The
# signature is keyless: Sigstore records that this repository's release
# workflow produced the file, so there is no signing key to keep.
signs:
  - id: sigstore
    artifacts: checksum
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    signature: "${artifact}.sigstore.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from the matching CHANGELOG.md section, passed with
# --release-notes by the release workflow. Do not set changelog.disable: it
# also discards those notes and publishes an empty release body.

release:
  github:
    owner: Cloudopsshell
    name: deaconguard
  name_template: "deaconguard v{{ .Version }}"
  # Tags with a suffix, such as v1.2.0-rc.1, are published as pre-releases.
  prerelease: auto
  extra_files:
    - glob: ./packaging/install.sh
