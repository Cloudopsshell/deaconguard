name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless cosign signing proves the release came from this workflow.
  id-token: write
  # The container image and Helm chart are published to GHCR.
  packages: write

jobs:
  release:
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag is a semantic version
        id: version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # The Compose file, the Kustomize manifests and the Helm chart must pin the
      # version being released. A pre-release such as 1.2.0-rc.1 checks 1.2.0.
      - name: Check the deploy files pin this version
        run: |
          version="${{ steps.version.outputs.version }}"
          sh scripts/set-version.sh --check "${version%%-*}"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="$RUNNER_TEMP/release-notes.md"
          # A pre-release such as 0.2.0-rc.1 uses the notes for the version it previews.
          for wanted in "$version" "${version%%-*}"; do
            awk -v wanted="[$wanted]" 'index($0, "## ") == 1 { found = index($0, wanted) > 0; next } /^\[[^]]+\]: / { found = 0 } found' CHANGELOG.md > "$notes"
            [ -s "$notes" ] && break
          done
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $version; add one before tagging"
            exit 1
          fi
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            { printf '> Pre-release of %s for testing. Do not use in production.\n\n' "${version%%-*}"; cat "$notes"; } > "$notes.tmp" && mv "$notes.tmp" "$notes"
          fi
          cat "$notes"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release, so builds include Go security fixes;
          # go.mod only states the minimum version.
          go-version: "1.26.x"
          # Without this, setup-go uses the runner's built-in Go even when a
          # newer patch release with security fixes is out.
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Pull request jobs run on this runner too, and its Go and npm caches
      # persist between jobs. A release must not reuse anything they left
      # there, so it builds with empty caches in this job's own temporary
      # directory, which the runner deletes afterwards, and checks every
      # module against go.sum.
      - name: Build with empty caches
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "npm_config_cache=$RUNNER_TEMP/npm"
          } >> "$GITHUB_ENV"

      - name: Download and verify Go modules
        run: |
          go mod download
          go mod verify

      # Go, Node.js and web/package-lock.json give the exact versions.
      - name: Add the dependency tables to the release notes
        run: sh scripts/release-dependencies.sh >> "${{ runner.temp }}/release-notes.md"

      - name: Install Syft for the SBOM
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # ko and cosign read registry logins from $DOCKER_CONFIG. The runner has
      # no Docker, so the login is written directly, for this job only.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GH_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Release binaries, DEB and RPM packages, and the container image
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A release and its candidate share a commit; without this GoReleaser
          # may pick the candidate's tag and upload to the wrong release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Check the published signatures
        run: |
          identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify "ghcr.io/cloudopsshell/deaconguard:${{ steps.version.outputs.version }}" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # The chart's appVersion and default image tag are the release's version.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm lint deploy/helm/deaconguard
          helm package deploy/helm/deaconguard --version "$version" --app-version "$version" --destination "$RUNNER_TEMP/chart"
          pushed=$(helm push "$RUNNER_TEMP/chart/deaconguard-$version.tgz" oci://ghcr.io/cloudopsshell/charts 2>&1 | tee /dev/stderr)
          digest=$(printf '%s\n' "$pushed" | sed -n 's/^Digest: //p')
          cosign sign --yes "ghcr.io/cloudopsshell/charts/deaconguard@$digest"
          helm registry logout ghcr.io

      - name: Log out of GHCR
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker"

      - name: Check the release notes were published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The self-hosted runner has no gh CLI; curl and the Node.js set up
        # above read the release through the API instead.
        run: |
          length=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log((JSON.parse(s).body||"").length))')
          if [ "$length" -lt 20 ]; then
            echo "::error::The GitHub release for $GITHUB_REF_NAME has no release notes"
            exit 1
          fi
