{{- if .Values.cluster.enabled }}
{{- $selector := dict "root" . "component" "cluster" }}
# The cluster agent: it checks this cluster through the Kubernetes API with
# a read-only role (list and get; no secrets), and reports to the server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deaconguard.clusterName" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "deaconguard.clusterName" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "deaconguard.clusterName" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "deaconguard.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "deaconguard.clusterName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "deaconguard.clusterName" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
spec:
  replicas: 1
  serviceName: {{ include "deaconguard.clusterName" . }}
  selector:
    matchLabels:
      {{- include "deaconguard.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deaconguard.labels" . | nindent 8 }}
        app.kubernetes.io/component: cluster
      {{- with .Values.cluster.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "deaconguard.clusterName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cluster
          image: {{ include "deaconguard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [agent, run]
          env:
            - name: DEACONGUARD_AGENT_CLUSTER
              value: {{ .Values.cluster.name | quote }}
            - name: DEACONGUARD_AGENT_CONFIG
              value: /var/lib/deaconguard-agent/agent.json
            - name: DEACONGUARD_ENROLL_TOKEN_FILE
              value: /run/secrets/deaconguard-enrollment/{{ .Values.cluster.enrollment.secretKey }}
          {{- with .Values.cluster.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: identity
              mountPath: /var/lib/deaconguard-agent
            - name: enrollment
              mountPath: /run/secrets/deaconguard-enrollment
              readOnly: true
      volumes:
        - name: enrollment
          secret:
            secretName: {{ include "deaconguard.clusterEnrollmentSecret" . }}
            # Only needed until the cluster agent has enrolled.
            optional: true
      {{- with .Values.cluster.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cluster.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cluster.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: identity
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.cluster.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cluster.persistence.size }}
{{- end }}
