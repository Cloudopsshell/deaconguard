<text x="528" y="258" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="5">sends results</text>
<path d="M665 128 L758 128" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head-light)"/>
