{{- include "deaconguard.withDefaults" . }}
{{- if and .Values.server.enabled .Values.server.admin.password (not .Values.server.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deaconguard.adminSecret" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.server.admin.secretKey }}: {{ .Values.server.admin.password | b64enc | quote }}
{{- end }}
{{- if and .Values.agent.enabled .Values.agent.enrollment.token (not .Values.agent.enrollment.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deaconguard.enrollmentSecret" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.agent.enrollment.secretKey }}: {{ .Values.agent.enrollment.token | b64enc | quote }}
{{- end }}
{{- if and .Values.cluster.enabled .Values.cluster.enrollment.token (not .Values.cluster.enrollment.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deaconguard.clusterEnrollmentSecret" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
type: Opaque
data:
  {{ .Values.cluster.enrollment.secretKey }}: {{ .Values.cluster.enrollment.token | b64enc | quote }}
{{- end }}
{{- $sharedUsed := or (and .Values.agent.enabled (not (include "deaconguard.ownEnrollment" .Values.agent.enrollment))) (and .Values.cluster.enabled (not (include "deaconguard.ownEnrollment" .Values.cluster.enrollment))) }}
{{- if and $sharedUsed .Values.enrollment.token (not .Values.enrollment.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deaconguard.sharedEnrollmentSecret" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.enrollment.secretKey }}: {{ .Values.enrollment.token | b64enc | quote }}
{{- end }}
