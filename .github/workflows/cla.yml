name: CLA

# Asks each new contributor to sign the Contributor License Agreement (CLA.md)
# by commenting on their pull request, and records the signature on the
# cla-signatures branch of this repository. No outside service and no personal
# token: the workflow's own GITHUB_TOKEN writes the record.
#
# pull_request_target runs this file from main, never from the pull request, and
# the job never checks out or runs the contributor's code, so it is safe on the
# self-hosted runners.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    name: CLA
    # Only pull request events, and comments on pull requests that sign or ask for a recheck.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'recheck') ||
        contains(github.event.comment.body, 'I hereby sign the CLA')))
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check and record CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Cloudopsshell/deaconguard/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: wilsonvj,dependabot[bot],github-actions[bot]
          signed-commit-message: "$contributorName signed the CLA in $owner/$repo"
          create-file-commit-message: "Start the CLA signature list"
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please read the
            [DeaconGuard Contributor License Agreement](https://github.com/Cloudopsshell/deaconguard/blob/main/CLA.md)
            and sign it by replying with the sentence below. You keep the copyright in your
            work; signing once covers all of your contributions.
          custom-allsigned-prcomment: Everyone who contributed to this pull request has signed the CLA. Thank you.
          lock-pullrequest-aftermerge: true
