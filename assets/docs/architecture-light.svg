<text x="520.0" y="350" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#475569">scans this machine</text>
<text x="520.0" y="369" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#475569">listens on nothing</text>
<rect x="482.0" y="376" width="76" height="22" rx="11" fill="#d1fae5"/>
<text x="520.0" y="392" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">as root</text>
<rect x="760" y="88" width="200" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="860.0" y="116" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0f172a">Advisory feeds</text>
<text x="860.0" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#475569">from each distribution</text>
<path d="M240 75 C300 75, 310 100, 373 100" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head-light)"/>
<text x="300" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="5">HTTPS</text>
