{{- if .Values.scan.schedule }}
{{- if not .Values.hosts }}
{{- fail "scan.schedule requires at least one entry in hosts" }}
{{- end }}
{{- if not .Values.ssh.existingSecret }}
{{- fail "scan.schedule requires ssh.existingSecret containing private keys" }}
{{- end }}
{{- if not .Values.ssh.knownHosts }}
{{- fail "scan.schedule requires ssh.knownHosts with independently verified host keys" }}
{{- end }}
{{- $profiles := list }}
{{- range .Values.hosts }}
{{- if not .id }}{{ fail "every hosts entry requires a stable id" }}{{ end }}
{{- if not .address }}{{ fail "every hosts entry requires an address" }}{{ end }}
{{- if not .username }}{{ fail "every hosts entry requires a username" }}{{ end }}
{{- if not .keyFile }}{{ fail "every hosts entry requires keyFile from ssh.existingSecret" }}{{ end }}
{{- $port := .port | default 22 }}
{{- $profiles = append $profiles (dict "id" .id "address" .address "username" .username "port" $port "key_path" (printf "/ssh-keys/%s" .keyFile)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsarmor.fullname" . }}-config
  labels:
    {{- include "opsarmor.labels" . | nindent 4 }}
data:
  hosts.json: {{ $profiles | toJson | quote }}
  known_hosts: |-
{{ .Values.ssh.knownHosts | indent 4 }}
{{- end }}