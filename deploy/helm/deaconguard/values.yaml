# DeaconGuard: https://docs.deaconguard.io/installation/kubernetes
#
# files/defaults.yaml must be a copy of this file (CI checks): the chart fills
# in settings an upgraded release lacks from it.
#
# The server and the agents are usually two releases, in two namespaces: the
# server runs under the restricted Pod Security Standard, and the agents need
# privileged, since each reads its node.

image:
  repository: ghcr.io/cloudopsshell/deaconguard
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

server:
  enabled: true
  # The first account, created when the server has none. Give its password
  # in an existing secret (recommended), or in admin.password, which the
  # chart puts in a secret. Ignored once any account exists.
  admin:
    username: admin
    existingSecret: ""
    secretKey: password
    password: ""
  # Networks of reverse proxies in front of the dashboard, such as the
  # ingress controller's pods, whose X-Forwarded-For the server believes.
  trustedProxies: []
  # A kubernetes.io/tls secret to serve instead of the self-signed
  # certificate. Agents trust a certificate that the system trusts for the
  # server's name, or its key's fingerprint from their token.
  tls:
    existingSecret: ""
  persistence:
    size: 5Gi
    storageClass: ""
    # Use an existing PersistentVolumeClaim instead of creating one.
    existingClaim: ""
  service:
    type: ClusterIP
    annotations: {}
    dashboardPort: 8443
    # Agents only. In the cluster: https://SERVICE.NAMESPACE.svc:8444
    agentPort: 8444
  # A Service of its own for the agent port, for agents on machines outside
  # the cluster, such as an internal load balancer, while the dashboard's
  # port stays inside. Agents need the TLS connection to reach the server
  # unchanged (their token pins its key), which a TCP load balancer does.
  agentService:
    enabled: false
    type: LoadBalancer
    # For a private load balancer, such as on EKS:
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    annotations: {}
    # The networks of the machines whose agents connect, such as 10.0.0.0/16.
    loadBalancerSourceRanges: []
    port: 8444
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # - host: deaconguard.example.com
    hosts: []
    # - secretName: deaconguard-tls
    #   hosts: [deaconguard.example.com]
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

agent:
  enabled: false
  # A reusable token from the server's Agents page, in an existing secret
  # (recommended), or in enrollment.token, which the chart puts in a secret.
  # Each node uses it once, to enroll.
  enrollment:
    existingSecret: ""
    secretKey: token
    token: ""
  # Where each node keeps its agent's identity, so a restarted pod is the
  # same host on the server.
  identityPath: /var/lib/deaconguard-agent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    # ClamAV, when the node has it, runs inside this limit.
    limits:
      memory: 2560Mi
  podAnnotations: {}
  nodeSelector: {}
  # Every node, control plane included.
  tolerations:
    - operator: Exists
  affinity: {}
  priorityClassName: ""

# The cluster agent checks this Kubernetes cluster through its API,
# read-only (1.5.0 and later): workloads, RBAC, namespaces, the version and
# the API server's settings. It appears on the server's Hosts page as a
# cluster, scanned with the Kubernetes check, by hand or on a schedule.
cluster:
  enabled: false
  # The cluster's name on the server.
  name: kubernetes
  # A token from the server's Agents page, in an existing secret
  # (recommended), or in enrollment.token, which the chart puts in a secret.
  # The cluster agent uses it once, to enroll.
  enrollment:
    existingSecret: ""
    secretKey: token
    token: ""
  # A small volume keeps the agent's identity, so a restarted pod is the
  # same cluster on the server.
  persistence:
    size: 16Mi
    storageClass: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # An admission webhook in warn mode (1.5.0 and later): kubectl shows
  # warnings for risky workloads and roles as they are applied; nothing is
  # ever blocked. The chart makes its certificate. Kubernetes' own
  # namespaces and this release's are left out.
  admission:
    enabled: false
    # The least severity that warns: critical, high, medium or low.
    severity: medium
