name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The newest 1.26 patch release, so builds include Go security fixes;
          # go.mod only states the minimum version.
          go-version: "1.26.x"
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal web)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  local-scan:
    name: Local scan (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build
        run: go build -o opsarmor ./cmd/opsarmor

      # A real scan of this Ubuntu runner with every check, through sudo, which
      # GitHub runners allow without a password.
      - name: Scan this machine
        env:
          OPSARMOR_HOME: ${{ runner.temp }}/opsarmor
        run: ./opsarmor scan --local --allow-sudo --checks packages,integrity,malware,config,antivirus --json > report.json

      - name: Check the report
        run: |
          jq -e '.os | startswith("Ubuntu")' report.json
          jq -e '.package_count > 100' report.json
          jq -e '.advisory_database.feed_stale == false' report.json
          for check in integrity malware config; do
            jq -e --arg c "$check" '.check_results[$c].status as $s | ($s == "completed" or $s == "partial")' report.json
            jq -e --arg c "$check" '.check_results[$c].privileged == true' report.json
          done
          jq -e '.check_results.antivirus.status | IN("completed", "partial", "skipped")' report.json
          {
            echo "### Local scan of the CI runner"
            echo
            jq -r '"\(.os) · \(.package_count) packages · \(.finding_count) package findings · \(.unsupported_count) rules not evaluated"' report.json
            echo
            echo "| Check | Status | Sudo | Findings | Summary |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.check_results | to_entries[] | "| \(.key) | \(.value.status) | \(.value.privileged) | \(.value.findings | length) | \(.value.summary) |"' report.json
            echo
            echo "<details><summary>Check findings</summary>"
            echo
            jq -r '.check_results | to_entries[] | .key as $c | .value.findings[] | "- **\($c)** \(.severity): \(.title) — `\(.evidence)`"' report.json
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-scan-report
          path: report.json
          if-no-files-found: ignore
