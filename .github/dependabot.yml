# Weekly update pull requests, grouped per ecosystem. Security updates are
# opened as soon as an advisory is published, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # v4 runs envsubst, which the self-hosted runners don't have, so the
      # release workflow fails; the release workflow, which Dependabot's pull
      # requests don't run, is where it is used. Allow it once the runner
      # image has gettext-base.
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
