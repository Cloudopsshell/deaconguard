name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release, so builds include Go security fixes;
          # go.mod only states the minimum version.
          go-version: "1.26.x"
          # Without this, setup-go uses the runner's built-in Go even when a
          # newer patch release with security fixes is out.
          check-latest: true
          # The runner keeps Go's build and module caches on its own volume
          # (GOCACHE, GOMODCACHE), so the GitHub cache, 1.3 GB downloaded and
          # uploaded again by every job, only cost time.
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal web)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # Shuffled, twice: tests must not depend on order or on state left by an earlier run.
        run: go test -race -shuffle=on -count=2 ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # DeaconGuard is MIT and ships its dependencies inside the binary, so
      # each must allow that. Add a licence here only after reading it; see
      # CONTRIBUTING.md, "Third-party content".
      - name: Go module licences
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --allowed_licenses=MIT,ISC,BSD-2-Clause,BSD-3-Clause,Apache-2.0

      - name: No restricted third-party content
        run: sh scripts/check-content.sh

  web:
    name: Web UI build
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # npm's download cache is on the runner's volume (npm_config_cache).
      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Web UI licences
        working-directory: web
        run: |
          npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages \
            --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0" >/dev/null

      - name: Type-check and build
        working-directory: web
        run: npm run build

  installer:
    name: Install script
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: packaging
        env:
          SHELLCHECK_OPTS: -s sh

      - name: ShellCheck the CI installer
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ci
        env:
          SHELLCHECK_OPTS: -s sh

      - name: The CI installer pins the same cosign as install.sh
        run: |
          pins() { grep -E '^COSIGN_(VERSION|SHA256_AMD64|SHA256_ARM64)=' "$1"; }
          if [ "$(pins packaging/install.sh)" != "$(pins ci/install.sh)" ]; then
            echo "::error::ci/install.sh and packaging/install.sh pin different cosign releases; update both together"
            exit 1
          fi

  action:
    name: GitHub Action
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      # The action normally installs a release; here it runs this commit's build.
      - name: Build deaconguard
        run: |
          go build -o "$RUNNER_TEMP/bin/deaconguard" ./cmd/deaconguard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check this repository's Dockerfile and manifests
        id: config
        uses: ./
        with:
          scan: config
          target: Dockerfile deploy
          version: installed
          cache: "false"
          output: config.sarif

      - name: Check an image in a registry
        uses: ./
        with:
          target: alpine:3.22
          fail-on: critical
          ignore-unfixed: "true"
          format: junit
          output: image.xml
          version: installed
          cache: "false"

      - name: The reports were written
        env:
          CONFIG_STATUS: ${{ steps.config.outputs.status }}
        run: |
          grep -q '"version": "2.1.0"' config.sarif
          grep -q 'DG-K8S-' config.sarif
          grep -q '<testsuites' image.xml
          [ "$CONFIG_STATUS" = "0" ]

  docs:
    name: Docs
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pages, sidebar, links, headings and images
        run: node scripts/check-docs.mjs

  helm-upgrade:
    name: Helm upgrade
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source, with the release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Renders the chart as helm upgrade --reuse-values does, with each earlier
      # release's values, for a server, an agent-only and a cluster-agent
      # release: what the Upgrade page tells people to run.
      - name: Upgrade every earlier release
        run: |
          helm lint deploy/helm/deaconguard
          sh scripts/check-chart-upgrade.sh

  release-config:
    name: Release config
    runs-on: [self-hosted, deaconguard]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

      - name: Check the deploy files pin one version
        run: |
          sh scripts/set-version.sh --check "$(sed -n 's/^version: //p' deploy/helm/deaconguard/Chart.yaml)"
