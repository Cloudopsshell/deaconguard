version: 2
project_name: opsarmor

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: opsarmor
    main: ./cmd/opsarmor
    binary: opsarmor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X opsarmor/internal/buildinfo.Version={{ .Version }}
      - -X opsarmor/internal/buildinfo.Commit={{ .FullCommit }}
      - -X opsarmor/internal/buildinfo.Date={{ .Date }}

archives:
  - id: default
    ids:
      - opsarmor
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE

# GoReleaser packages only the Linux builds as .deb and .rpm.
nfpms:
  - id: linux-packages
    package_name: opsarmor
    ids:
      - opsarmor
    vendor: CloudOpsShell
    homepage: https://github.com/Cloudopsshell/OpsArmor
    maintainer: CloudOpsShell <opensource@cloudopsshell.com>
    description: >-
      Linux security scanner: package vulnerabilities from official
      distribution advisories, file integrity, malware indicators, security
      configuration, and ClamAV. One binary is the server, with an HTTPS
      dashboard, and the agent that enrolls with it using a one-time token.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/opsarmor/README.md
        type: doc
      - src: CHANGELOG.md
        dst: /usr/share/doc/opsarmor/CHANGELOG.md
        type: doc
      - src: LICENSE
        dst: /usr/share/doc/opsarmor/copyright
        type: doc
      - src: packaging/systemd/opsarmor-agent.service
        dst: /usr/lib/systemd/system/opsarmor-agent.service
        file_info:
          mode: 0644
      - src: packaging/systemd/opsarmor-server.service
        dst: /usr/lib/systemd/system/opsarmor-server.service
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
    deb:
      lintian_overrides:
        - statically-linked-binary
    rpm:
      summary: Linux security scanner with server and agent

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from the matching CHANGELOG.md section, passed with
# --release-notes by the release workflow. Do not set changelog.disable: it
# also discards those notes and publishes an empty release body.

release:
  github:
    owner: Cloudopsshell
    name: OpsArmor
  name_template: "OpsArmor v{{ .Version }}"
  # Tags with a suffix, such as v0.2.0-rc.1, are published as pre-releases.
  prerelease: auto
