image:
  repository: ghcr.io/cloudopsshell/opsarmor
  tag: ""
  pullPolicy: IfNotPresent

scan:
  # Leave empty to install no scan jobs until configuration is supplied.
  schedule: ""
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

hosts: []

ssh:
  existingSecret: ""
  knownHosts: ""

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}