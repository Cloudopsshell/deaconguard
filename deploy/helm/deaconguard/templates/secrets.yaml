{{- if and .Values.server.enabled .Values.server.admin.password (not .Values.server.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deaconguard.adminSecret" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.server.admin.secretKey }}: {{ .Values.server.admin.password | b64enc | quote }}
{{- end }}
{{- if and .Values.agent.enabled .Values.agent.enrollment.token (not .Values.agent.enrollment.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deaconguard.enrollmentSecret" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.agent.enrollment.secretKey }}: {{ .Values.agent.enrollment.token | b64enc | quote }}
{{- end }}
