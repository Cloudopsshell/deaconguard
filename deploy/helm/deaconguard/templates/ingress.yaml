{{- include "deaconguard.withDefaults" . }}
{{- if and .Values.server.enabled .Values.server.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "deaconguard.fullname" . }}
  labels:
    {{- include "deaconguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- $annotations := deepCopy (.Values.server.ingress.annotations | default dict) }}
  {{- $traefik := .Values.server.ingress.traefik }}
  {{- if $traefik.enabled }}
  {{- $middlewares := list }}
  {{- if $traefik.allowSourceRanges }}
  {{- $middlewares = append $middlewares (printf "%s-%s-allow@kubernetescrd" .Release.Namespace (include "deaconguard.fullname" .)) }}
  {{- end }}
  {{- $middlewares = concat $middlewares ($traefik.middlewares | default list) }}
  {{- with index $annotations "traefik.ingress.kubernetes.io/router.middlewares" }}
  {{- $middlewares = append $middlewares . }}
  {{- end }}
  {{- with $middlewares }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (join "," .) }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.server.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.server.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.server.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "deaconguard.fullname" $ }}
                port:
                  name: dashboard
    {{- end }}
{{- end }}
