<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t-light d-light">
<title id="t-light">How DeaconGuard works</title>
<desc id="d-light">The server runs without root and serves the dashboard. Every machine, the server's own included, runs an agent as root that asks the server for work and sends back results. The server downloads the distributions' advisories.</desc>
<defs><marker id="head-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="980" height="470" rx="16" fill="#ffffff"/>
<rect x="30" y="40" width="210" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="135.0" y="68" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0f172a">You</text>
<text x="135.0" y="90" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#475569">in a browser</text>
<rect x="20" y="190" width="230" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="36" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">OTHER MACHINES</text>
<rect x="40" y="232" width="190" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="135.0" y="260" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0f172a">deaconguard-agent</text>
<text x="135.0" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#475569">listens on nothing</text>
<rect x="97.0" y="289" width="76" height="22" rx="11" fill="#d1fae5"/>
<text x="135.0" y="305" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">as root</text>
<rect x="40" y="335" width="190" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="135.0" y="363" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0f172a">deaconguard-agent</text>
<text x="135.0" y="385" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#475569">listens on nothing</text>
<rect x="97.0" y="392" width="76" height="22" rx="11" fill="#d1fae5"/>
<text x="135.0" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">as root</text>
<rect x="350" y="20" width="340" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="366" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">SERVER MACHINE</text>
<rect x="375" y="60" width="290" height="130" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
